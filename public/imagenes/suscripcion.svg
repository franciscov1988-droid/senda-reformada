<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-label="Sobre con una carta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d6b52"/>
      <stop offset="1" stop-color="#3f4a38"/>
    </linearGradient>
    <linearGradient id="sobre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c06a2d"/>
      <stop offset="1" stop-color="#a8521c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="460" rx="20" fill="url(#bg)"/>

  <!-- puntitos decorativos -->
  <g fill="#efe9db" opacity="0.18">
    <circle cx="70" cy="70" r="6"/><circle cx="110" cy="50" r="4"/><circle cx="540" cy="90" r="6"/>
    <circle cx="520" cy="55" r="4"/><circle cx="80" cy="400" r="5"/><circle cx="545" cy="390" r="6"/>
  </g>

  <!-- carta -->
  <g transform="translate(150 95)">
    <rect x="0" y="0" width="300" height="210" rx="10" fill="#faf8f1" stroke="#e4ddd0" stroke-width="2"/>
    <!-- cruz -->
    <g transform="translate(150 55)" fill="#a8521c">
      <rect x="-9" y="-28" width="18" height="70" rx="3"/>
      <rect x="-28" y="-9" width="70" height="18" rx="3"/>
    </g>
    <!-- líneas de texto -->
    <g fill="#d8d1c2">
      <rect x="55" y="120" width="190" height="10" rx="5"/>
      <rect x="75" y="145" width="150" height="10" rx="5"/>
      <rect x="95" y="170" width="110" height="10" rx="5"/>
    </g>
  </g>

  <!-- sobre -->
  <g transform="translate(120 190)">
    <rect x="0" y="0" width="360" height="230" rx="16" fill="url(#sobre)"/>
    <path d="M0 16 L180 150 L360 16" fill="none" stroke="#efe9db" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M0 230 L140 120" stroke="#8f4518" stroke-width="8" opacity="0.5" fill="none"/>
    <path d="M360 230 L220 120" stroke="#8f4518" stroke-width="8" opacity="0.5" fill="none"/>
  </g>
</svg>
